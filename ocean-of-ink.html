<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ocean of Ink | Inkspirations Studios</title>
<meta name="description" content="Ocean of Ink, an immersive artistic environment from Inkspirations Studios.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#061a39;color:#f7fbff}
body{font-family:'Cormorant Garamond',serif;overflow:hidden}
a{color:inherit;text-decoration:none}
:root{--aqua:#9cecf5;--line:rgba(210,243,255,.22)}
.ocean{position:relative;min-height:100svh;overflow:hidden;isolation:isolate;background:linear-gradient(119deg,rgba(3,19,55,.97) 0%,rgba(5,46,96,.86) 40%,rgba(6,82,126,.64) 69%,rgba(7,106,130,.69) 100%),linear-gradient(180deg,#06172f 0%,#073d70 52%,#075e7d 77%,#08727f 100%)}
.ocean::before{content:"";position:absolute;inset:-14% -10%;z-index:-4;pointer-events:none;background:linear-gradient(103deg,transparent 0 8%,rgba(2,12,61,.82) 17%,rgba(7,54,130,.54) 28%,rgba(0,117,158,.18) 39%,transparent 51%),linear-gradient(93deg,transparent 0 51%,rgba(2,27,84,.52) 61%,rgba(0,105,148,.22) 71%,transparent 85%),linear-gradient(78deg,transparent 0 29%,rgba(6,53,129,.22) 39%,rgba(0,137,159,.13) 49%,transparent 62%);filter:blur(42px);opacity:.78;mix-blend-mode:multiply;animation:inkDrift 24s ease-in-out infinite alternate}
.ocean::after{content:"";position:absolute;inset:0;z-index:-2;pointer-events:none;background:linear-gradient(226deg,rgba(250,255,255,.80) 0%,rgba(215,248,255,.46) 8%,rgba(151,229,253,.20) 18%,rgba(106,207,241,.08) 28%,transparent 43%),linear-gradient(214deg,transparent 0 57%,rgba(94,198,231,.07) 68%,transparent 82%),linear-gradient(90deg,rgba(2,14,42,.26) 0%,rgba(2,14,42,.11) 34%,transparent 64%)}
.light-reflection{position:absolute;right:-4vw;top:-22vh;width:min(42vw,620px);height:100vh;z-index:-1;pointer-events:none;background:linear-gradient(180deg,rgba(240,253,255,.31),rgba(163,232,255,.12) 38%,rgba(91,194,230,.035) 63%,transparent 83%);filter:blur(34px);transform:rotate(13deg);transform-origin:top center;opacity:.74}
.nav{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;justify-content:space-between;align-items:center;padding:1.15rem clamp(1.25rem,5vw,4.75rem);background:rgba(3,14,39,.52);backdrop-filter:blur(14px);border-bottom:1px solid rgba(151,217,255,.12)}
.brand{font-family:'Cinzel',serif;font-size:.70rem;font-weight:600;letter-spacing:.20em;text-transform:uppercase}.nav-links{display:flex;gap:1.65rem;flex-wrap:wrap;justify-content:flex-end}.nav-links a{font-family:'Cinzel',serif;font-size:.56rem;letter-spacing:.17em;text-transform:uppercase;color:rgba(244,250,255,.68)}
.hero{position:relative;z-index:5;min-height:100svh;display:flex;align-items:center;padding:8rem clamp(1.5rem,7vw,7rem) 5.5rem}.hero-inner{width:min(830px,88vw);margin-left:clamp(0rem,3vw,3.5rem);text-align:left}.eyebrow{margin:0 0 1.55rem;font-family:'Cinzel',serif;color:var(--aqua);font-size:.63rem;font-weight:600;letter-spacing:.30em;text-transform:uppercase}
h1{margin:0;font-family:'Playfair Display',serif;font-size:clamp(4.85rem,8.55vw,8.7rem);font-weight:800;line-height:.96;letter-spacing:.008em;text-shadow:0 18px 48px rgba(0,0,0,.24)}
h1 span{display:block;margin-top:.12em;color:#edfaff;font-weight:800}
.actions{display:flex;gap:1rem;flex-wrap:wrap;margin-top:2.55rem}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:.9rem 1.3rem;border:1px solid var(--line);background:rgba(2,21,49,.16);backdrop-filter:blur(8px);font-family:'Cinzel',serif;font-size:.58rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase}.btn.primary{background:rgba(100,215,228,.92);color:#06233a;border-color:rgba(237,255,255,.66)}
.bubbles{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}.bubble{position:absolute;bottom:-8vh;border-radius:50%;background:transparent;border:1px solid rgba(238,253,255,.40);box-shadow:inset 0 0 2px rgba(255,255,255,.12);animation:rise linear infinite}
@keyframes rise{0%{transform:translate3d(0,0,0);opacity:0}14%{opacity:.42}82%{opacity:.24}100%{transform:translate3d(var(--drift),-116vh,0);opacity:0}}@keyframes inkDrift{0%{transform:translateX(-1%) scale(1.01)}100%{transform:translateX(1%) scale(1.02)}}
@media(max-width:760px){.nav{align-items:flex-start}.nav-links{gap:.75rem}.nav-links a{font-size:.50rem}.hero{padding-top:7.6rem}.hero-inner{width:92vw;margin-left:0}.eyebrow{margin-bottom:1.25rem}h1{font-size:clamp(4rem,18vw,6.15rem);line-height:.98;letter-spacing:.006em}h1 span{margin-top:.10em}.actions{margin-top:2.2rem}}
@media(prefers-reduced-motion:reduce){.ocean::before,.bubble{animation:none!important}}
</style>
</head>
<body>
<main class="ocean" id="ocean">
  <div class="light-reflection" aria-hidden="true"></div>
  <div class="bubbles" id="bubbles" aria-hidden="true"></div>
  <nav class="nav" aria-label="Ocean of Ink navigation">
    <a class="brand" href="index.html">Inkspirations Studios</a>
    <div class="nav-links"><a href="rooms.html">Rooms</a><a href="systems-i-built.html">Direction</a><a href="portfolio.html">Work</a></div>
  </nav>
  <section class="hero">
    <div class="hero-inner">
      <p class="eyebrow">Ink in Motion</p>
      <h1>Ocean <span>of Ink</span></h1>
      <div class="actions"><a class="btn primary" href="rooms.html">Enter the Current</a><a class="btn" href="rooms.html">Explore the Rooms</a></div>
    </div>
  </section>
</main>
<script>
const layer=document.getElementById('bubbles');for(let i=0;i<14;i++){const b=document.createElement('span');b.className='bubble';const s=3+Math.random()*3.5;b.style.width=s+'px';b.style.height=s+'px';b.style.left=(4+Math.random()*92)+'%';b.style.animationDuration=(20+Math.random()*20)+'s';b.style.animationDelay=(-Math.random()*32)+'s';b.style.setProperty('--drift',(Math.random()*38-19)+'px');layer.appendChild(b)}
</script>
</body>
</html>
