<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ocean of Ink | Inkspirations Studios</title>
<meta name="description" content="Ocean of Ink, an immersive artistic environment from Inkspirations Studios.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#061a39;color:#f7fbff}
body{font-family:'Cormorant Garamond',serif;overflow:hidden}
a{color:inherit;text-decoration:none}
:root{--ocean:#0174f3;--aqua:#9cecf5;--soft:rgba(242,249,255,.76);--line:rgba(210,243,255,.22)}

.ocean{
  position:relative;min-height:100svh;overflow:hidden;isolation:isolate;
  background:
    linear-gradient(118deg,rgba(3,21,59,.94) 0%,rgba(5,49,100,.80) 38%,rgba(6,89,133,.54) 68%,rgba(8,118,138,.58) 100%),
    linear-gradient(180deg,#06172f 0%,#073d70 52%,#075e7d 77%,#08727f 100%);
}

/* translucent ink veils, not decorative shapes */
.ink-veil{position:absolute;inset:-10%;z-index:-4;pointer-events:none;filter:blur(34px);opacity:.82;mix-blend-mode:multiply}
.ink-veil.one{background:
  linear-gradient(102deg,transparent 0 5%,rgba(3,14,67,.86) 12%,rgba(7,58,137,.56) 24%,rgba(0,126,165,.18) 36%,transparent 49%),
  linear-gradient(90deg,transparent 0 52%,rgba(2,31,92,.50) 62%,rgba(0,116,156,.22) 72%,transparent 85%)}
.ink-veil.two{background:
  linear-gradient(75deg,transparent 0 28%,rgba(7,61,142,.24) 38%,rgba(0,145,168,.14) 49%,transparent 62%),
  linear-gradient(115deg,transparent 0 61%,rgba(2,25,84,.34) 71%,rgba(0,105,149,.18) 82%,transparent 94%);opacity:.66;filter:blur(46px)}

/* soft light entering from the top right */
.top-light{position:absolute;inset:0;z-index:-2;pointer-events:none;background:
  linear-gradient(222deg,rgba(245,254,255,.72) 0%,rgba(189,241,255,.33) 9%,rgba(114,213,248,.13) 21%,transparent 43%),
  linear-gradient(197deg,transparent 0 55%,rgba(2,16,46,.20) 80%,rgba(2,12,35,.34) 100%)}
.light-beam{position:absolute;right:4vw;top:-18vh;width:min(32vw,430px);height:86vh;z-index:-1;pointer-events:none;background:linear-gradient(180deg,rgba(231,252,255,.32),rgba(141,224,255,.11) 40%,transparent 80%);filter:blur(28px);transform:rotate(15deg);transform-origin:top center;opacity:.72}

.nav{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;justify-content:space-between;align-items:center;padding:1.15rem clamp(1.25rem,5vw,4.75rem);background:rgba(3,14,39,.52);backdrop-filter:blur(14px);border-bottom:1px solid rgba(151,217,255,.12)}
.brand{font-family:'Cinzel',serif;font-size:.70rem;font-weight:600;letter-spacing:.20em;text-transform:uppercase}
.nav-links{display:flex;gap:1.65rem;flex-wrap:wrap;justify-content:flex-end}
.nav-links a{font-family:'Cinzel',serif;font-size:.56rem;letter-spacing:.17em;text-transform:uppercase;color:rgba(244,250,255,.68)}

.frame{position:relative;z-index:5;min-height:100svh;display:grid;align-items:center;padding:7.5rem clamp(1.4rem,5.5vw,5.5rem) 5rem}
.frame-inner{width:min(1220px,100%);margin:0 auto;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(280px,.95fr);gap:clamp(3rem,8vw,8rem);align-items:center}
.copy{text-align:left;max-width:660px}
.eyebrow{margin:0 0 1.55rem;font-family:'Cinzel',serif;color:var(--aqua);font-size:.64rem;font-weight:600;letter-spacing:.28em;text-transform:uppercase}
h1{margin:0;font-family:'Playfair Display',serif;font-size:clamp(4.6rem,8vw,8.5rem);font-weight:800;line-height:.94;letter-spacing:-.045em;text-shadow:0 16px 46px rgba(0,0,0,.24)}
h1 span{display:block;margin-top:.18em;color:#ecfbff}
.subline{margin:2.15rem 0 0;max-width:520px;color:var(--soft);font-size:clamp(1.04rem,1.7vw,1.30rem);font-style:italic;font-weight:300;line-height:1.75;letter-spacing:.015em}
.actions{display:flex;gap:.9rem;flex-wrap:wrap;margin-top:2.65rem}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:.88rem 1.25rem;border:1px solid var(--line);background:rgba(2,21,49,.17);backdrop-filter:blur(8px);font-family:'Cinzel',serif;font-size:.58rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase}
.btn.primary{background:rgba(100,215,228,.92);color:#06233a;border-color:rgba(237,255,255,.66)}

.visual-balance{position:relative;min-height:500px;align-self:stretch}
.visual-balance::before{content:"";position:absolute;inset:10% 0 8% 8%;background:
  linear-gradient(154deg,rgba(255,255,255,.07),transparent 28%),
  linear-gradient(112deg,transparent 0 28%,rgba(89,196,231,.06) 50%,transparent 73%);border-left:1px solid rgba(221,247,255,.10);opacity:.86}
.visual-balance::after{content:"";position:absolute;right:9%;top:10%;width:1px;height:70%;background:linear-gradient(180deg,rgba(229,250,255,.34),rgba(229,250,255,.03),transparent)}

.bubbles{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.bubble{position:absolute;bottom:-8vh;border-radius:50%;background:transparent;border:1px solid rgba(238,253,255,.43);box-shadow:inset 0 0 2px rgba(255,255,255,.14);animation:rise linear infinite}
@keyframes rise{0%{transform:translate3d(0,0,0);opacity:0}14%{opacity:.48}82%{opacity:.28}100%{transform:translate3d(var(--drift),-116vh,0);opacity:0}}

@media(max-width:900px){.frame-inner{grid-template-columns:1fr;gap:2rem}.visual-balance{min-height:180px}.visual-balance::before{inset:0}.copy{max-width:720px}}
@media(max-width:700px){.nav{align-items:flex-start}.nav-links{gap:.75rem}.nav-links a{font-size:.50rem}.frame{padding-top:7.4rem}.eyebrow{margin-bottom:1.2rem}h1{font-size:clamp(4rem,18vw,6rem)}.subline{margin-top:1.7rem}.visual-balance{display:none}}
@media(prefers-reduced-motion:reduce){.bubble{animation:none!important}}
</style>
</head>
<body>
<main class="ocean" id="ocean">
  <div class="ink-veil one" aria-hidden="true"></div>
  <div class="ink-veil two" aria-hidden="true"></div>
  <div class="top-light" aria-hidden="true"></div>
  <div class="light-beam" aria-hidden="true"></div>
  <div class="bubbles" id="bubbles" aria-hidden="true"></div>

  <nav class="nav" aria-label="Ocean of Ink navigation">
    <a class="brand" href="index.html">Inkspirations Studios</a>
    <div class="nav-links">
      <a href="rooms.html">Rooms</a>
      <a href="systems-i-built.html">Direction</a>
      <a href="portfolio.html">Work</a>
    </div>
  </nav>

  <section class="frame">
    <div class="frame-inner">
      <div class="copy">
        <p class="eyebrow">Ink in Motion</p>
        <h1>Ocean <span>of Ink</span></h1>
        <p class="subline">An immersive room of blue, light, motion, and ink.</p>
        <div class="actions">
          <a class="btn primary" href="rooms.html">Enter the Current</a>
          <a class="btn" href="rooms.html">Explore the Rooms</a>
        </div>
      </div>
      <div class="visual-balance" aria-hidden="true"></div>
    </div>
  </section>
</main>
<script>
const layer=document.getElementById('bubbles');
for(let i=0;i<18;i++){
  const b=document.createElement('span');
  b.className='bubble';
  const s=3+Math.random()*4.5;
  b.style.width=s+'px';b.style.height=s+'px';
  b.style.left=(3+Math.random()*94)+'%';
  b.style.animationDuration=(18+Math.random()*18)+'s';
  b.style.animationDelay=(-Math.random()*30)+'s';
  b.style.setProperty('--drift',(Math.random()*46-23)+'px');
  layer.appendChild(b);
}
</script>
</body>
</html>
