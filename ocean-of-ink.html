<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ocean of Ink | Inkspirations Studios</title>
<meta name="description" content="Ocean of Ink, an immersive artistic environment from Inkspirations Studios.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#061a39;color:#f7fbff}
body{font-family:'Cormorant Garamond',serif;overflow:hidden}
a{color:inherit;text-decoration:none}
:root{--aqua:#9cecf5;--line:rgba(210,243,255,.22)}

.ocean{
  position:relative;min-height:100svh;overflow:hidden;isolation:isolate;
  background:
    linear-gradient(118deg,rgba(3,20,58,.96) 0%,rgba(5,48,99,.84) 40%,rgba(6,87,130,.60) 69%,rgba(7,112,132,.66) 100%),
    linear-gradient(180deg,#06172f 0%,#073d70 52%,#075e7d 77%,#08727f 100%);
}

/* broad translucent ink washes, never discrete blobs */
.ocean::before{
  content:"";position:absolute;inset:-12% -8%;z-index:-4;pointer-events:none;
  background:
    linear-gradient(101deg,transparent 0 7%,rgba(2,13,63,.78) 16%,rgba(8,58,137,.50) 26%,rgba(0,126,164,.16) 38%,transparent 50%),
    linear-gradient(92deg,transparent 0 49%,rgba(2,29,88,.48) 59%,rgba(0,112,153,.20) 70%,transparent 84%),
    linear-gradient(75deg,transparent 0 27%,rgba(6,57,137,.20) 38%,rgba(0,143,165,.12) 48%,transparent 61%);
  filter:blur(38px);opacity:.80;mix-blend-mode:multiply;
  animation:inkDrift 22s ease-in-out infinite alternate;
}

/* reflected surface light entering from upper right */
.ocean::after{
  content:"";position:absolute;inset:0;z-index:-2;pointer-events:none;
  background:
    linear-gradient(224deg,rgba(250,255,255,.78) 0%,rgba(211,247,255,.42) 8%,rgba(138,224,252,.18) 18%,transparent 39%),
    linear-gradient(205deg,transparent 0 54%,rgba(88,197,233,.08) 68%,transparent 82%),
    linear-gradient(90deg,rgba(2,14,42,.28) 0%,rgba(2,14,42,.12) 34%,transparent 63%);
}
.light-reflection{
  position:absolute;right:-2vw;top:-17vh;width:min(38vw,560px);height:95vh;z-index:-1;pointer-events:none;
  background:linear-gradient(180deg,rgba(237,253,255,.34),rgba(154,231,255,.13) 36%,rgba(83,188,229,.04) 61%,transparent 82%);
  filter:blur(30px);transform:rotate(14deg);transform-origin:top center;opacity:.80;
}

.nav{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;justify-content:space-between;align-items:center;padding:1.15rem clamp(1.25rem,5vw,4.75rem);background:rgba(3,14,39,.52);backdrop-filter:blur(14px);border-bottom:1px solid rgba(151,217,255,.12)}
.brand{font-family:'Cinzel',serif;font-size:.70rem;font-weight:600;letter-spacing:.20em;text-transform:uppercase}
.nav-links{display:flex;gap:1.65rem;flex-wrap:wrap;justify-content:flex-end}
.nav-links a{font-family:'Cinzel',serif;font-size:.56rem;letter-spacing:.17em;text-transform:uppercase;color:rgba(244,250,255,.68)}

.hero{position:relative;z-index:5;min-height:100svh;display:flex;align-items:center;padding:8rem clamp(1.5rem,7vw,7rem) 5.5rem}
.hero-inner{width:min(820px,88vw);margin-left:clamp(0rem,3vw,3.5rem);text-align:left}
.eyebrow{margin:0 0 1.9rem;font-family:'Cinzel',serif;color:var(--aqua);font-size:.63rem;font-weight:600;letter-spacing:.30em;text-transform:uppercase}
h1{margin:0;font-family:'Playfair Display',serif;font-size:clamp(4.8rem,8.6vw,8.7rem);font-weight:800;line-height:1;letter-spacing:-.038em;text-shadow:0 18px 48px rgba(0,0,0,.24)}
h1 span{display:block;margin-top:.24em;color:#edfaff}
.actions{display:flex;gap:1rem;flex-wrap:wrap;margin-top:3rem}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:.9rem 1.3rem;border:1px solid var(--line);background:rgba(2,21,49,.16);backdrop-filter:blur(8px);font-family:'Cinzel',serif;font-size:.58rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase}
.btn.primary{background:rgba(100,215,228,.92);color:#06233a;border-color:rgba(237,255,255,.66)}

.bubbles{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.bubble{position:absolute;bottom:-8vh;border-radius:50%;background:transparent;border:1px solid rgba(238,253,255,.42);box-shadow:inset 0 0 2px rgba(255,255,255,.14);animation:rise linear infinite}
@keyframes rise{0%{transform:translate3d(0,0,0);opacity:0}14%{opacity:.46}82%{opacity:.27}100%{transform:translate3d(var(--drift),-116vh,0);opacity:0}}
@keyframes inkDrift{0%{transform:translateX(-1.2%) scale(1.01)}100%{transform:translateX(1.2%) scale(1.025)}}

@media(max-width:760px){
  .nav{align-items:flex-start}.nav-links{gap:.75rem}.nav-links a{font-size:.50rem}
  .hero{padding-top:7.6rem}.hero-inner{width:92vw;margin-left:0}
  .eyebrow{margin-bottom:1.45rem}h1{font-size:clamp(4rem,18vw,6.2rem)}h1 span{margin-top:.20em}.actions{margin-top:2.5rem}
}
@media(prefers-reduced-motion:reduce){.ocean::before,.bubble{animation:none!important}}
</style>
</head>
<body>
<main class="ocean" id="ocean">
  <div class="light-reflection" aria-hidden="true"></div>
  <div class="bubbles" id="bubbles" aria-hidden="true"></div>

  <nav class="nav" aria-label="Ocean of Ink navigation">
    <a class="brand" href="index.html">Inkspirations Studios</a>
    <div class="nav-links">
      <a href="rooms.html">Rooms</a>
      <a href="systems-i-built.html">Direction</a>
      <a href="portfolio.html">Work</a>
    </div>
  </nav>

  <section class="hero">
    <div class="hero-inner">
      <p class="eyebrow">Ink in Motion</p>
      <h1>Ocean <span>of Ink</span></h1>
      <div class="actions">
        <a class="btn primary" href="rooms.html">Enter the Current</a>
        <a class="btn" href="rooms.html">Explore the Rooms</a>
      </div>
    </div>
  </section>
</main>
<script>
const layer=document.getElementById('bubbles');
for(let i=0;i<16;i++){
  const b=document.createElement('span');
  b.className='bubble';
  const s=3+Math.random()*4;
  b.style.width=s+'px';b.style.height=s+'px';
  b.style.left=(4+Math.random()*92)+'%';
  b.style.animationDuration=(19+Math.random()*19)+'s';
  b.style.animationDelay=(-Math.random()*31)+'s';
  b.style.setProperty('--drift',(Math.random()*42-21)+'px');
  layer.appendChild(b);
}
</script>
</body>
</html>
