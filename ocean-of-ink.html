<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ocean of Ink | Inkspirations Studios</title>
<meta name="description" content="Ocean of Ink by Inkspirations Studios.">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#06254c;color:#f7fbff}body{font-family:Arial,sans-serif;overflow:hidden}a{color:inherit;text-decoration:none}
.ocean{position:relative;min-height:100svh;overflow:hidden;isolation:isolate;background:
linear-gradient(180deg,rgba(198,244,255,.16) 0%,rgba(105,207,245,.06) 14%,transparent 34%),
linear-gradient(115deg,rgba(0,33,92,.30) 0 20%,transparent 42%),
linear-gradient(70deg,transparent 48%,rgba(0,152,173,.12) 71%,transparent 89%),
linear-gradient(135deg,#06244e 0%,#07518b 46%,#087c98 78%,#0a8190 100%)}
.ocean::before{content:"";position:absolute;inset:-8% -4%;z-index:-3;pointer-events:none;filter:blur(22px);opacity:.68;background:
linear-gradient(98deg,transparent 0 10%,rgba(3,26,95,.66) 17%,rgba(9,73,154,.34) 25%,transparent 36%),
linear-gradient(102deg,transparent 0 55%,rgba(1,40,109,.46) 64%,rgba(0,135,166,.24) 72%,transparent 82%),
linear-gradient(84deg,transparent 0 31%,rgba(5,59,146,.22) 39%,rgba(0,155,176,.14) 45%,transparent 52%);animation:inkShift 18s ease-in-out infinite alternate}
.ocean::after{content:"";position:absolute;inset:0;z-index:-2;pointer-events:none;background:
linear-gradient(166deg,rgba(232,252,255,.26) 0%,rgba(142,226,255,.08) 14%,transparent 31%),
linear-gradient(90deg,rgba(2,16,46,.36) 0%,rgba(2,16,46,.18) 34%,transparent 66%)}
.nav{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:1rem clamp(1rem,4vw,3.5rem);background:linear-gradient(180deg,rgba(2,12,31,.76),rgba(2,12,31,.24),transparent)}
.brand{font-size:.62rem;font-weight:900;letter-spacing:.16em;text-transform:uppercase}.nav-links{display:flex;gap:1.15rem;flex-wrap:wrap;justify-content:flex-end}.nav-links a{font-size:.58rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:rgba(247,251,255,.82)}
.hero{position:relative;z-index:4;min-height:100svh;display:flex;align-items:center;padding:7.5rem clamp(1.2rem,7vw,7rem) 5rem}
.hero-inner{width:min(760px,86vw);text-align:left}.eyebrow{margin:0 0 .9rem;color:#8cf0f6;font-size:.67rem;font-weight:900;letter-spacing:.22em;text-transform:uppercase}.hero h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:clamp(4.6rem,9vw,8.8rem);font-weight:500;line-height:.86;letter-spacing:-.055em;text-shadow:0 16px 44px rgba(0,0,0,.24)}.hero h1 span{display:block;color:#ecfcff}.actions{display:flex;gap:.8rem;flex-wrap:wrap;margin-top:2rem}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:45px;padding:.85rem 1.05rem;border:1px solid rgba(209,246,255,.30);background:rgba(2,21,50,.18);backdrop-filter:blur(6px);font-size:.61rem;font-weight:900;letter-spacing:.13em;text-transform:uppercase}.btn.primary{background:#54d8e2;color:#04233b;border-color:rgba(235,255,255,.65)}
.bubbles{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}.bubble{position:absolute;bottom:-8vh;border-radius:50%;background:transparent;border:1px solid rgba(236,253,255,.48);box-shadow:inset 0 0 2px rgba(255,255,255,.18);animation:rise linear infinite}
@keyframes rise{0%{transform:translate3d(0,0,0);opacity:0}12%{opacity:.55}82%{opacity:.32}100%{transform:translate3d(var(--drift),-116vh,0);opacity:0}}
@keyframes inkShift{0%{transform:translateX(-1.5%);filter:blur(22px) hue-rotate(-2deg)}100%{transform:translateX(1.5%);filter:blur(24px) hue-rotate(4deg)}}
@media(max-width:720px){.nav{align-items:flex-start}.nav-links{gap:.65rem}.nav a{font-size:.52rem}.hero{padding-top:7.2rem}.hero-inner{width:92vw}.hero h1{font-size:clamp(4rem,18vw,6.2rem)}}
@media(prefers-reduced-motion:reduce){.ocean::before,.bubble{animation:none!important}}
</style>
</head>
<body>
<main class="ocean" id="ocean">
  <nav class="nav" aria-label="Ocean of Ink navigation">
    <a class="brand" href="index.html">Inkspirations Studios</a>
    <div class="nav-links"><a href="rooms.html">Rooms</a><a href="systems-i-built.html">Direction</a><a href="portfolio.html">Work</a></div>
  </nav>
  <div class="bubbles" id="bubbles" aria-hidden="true"></div>
  <section class="hero">
    <div class="hero-inner">
      <p class="eyebrow">Ink in Motion</p>
      <h1>Ocean <span>of Ink</span></h1>
      <div class="actions"><a class="btn primary" href="rooms.html">Enter the Current</a><a class="btn" href="rooms.html">Explore the Rooms</a></div>
    </div>
  </section>
</main>
<script>
const layer=document.getElementById('bubbles');
for(let i=0;i<24;i++){
  const b=document.createElement('span');b.className='bubble';
  const s=3+Math.random()*5;b.style.width=s+'px';b.style.height=s+'px';
  b.style.left=(2+Math.random()*96)+'%';
  b.style.animationDuration=(16+Math.random()*18)+'s';
  b.style.animationDelay=(-Math.random()*28)+'s';
  b.style.setProperty('--drift',(Math.random()*54-27)+'px');
  layer.appendChild(b);
}
</script>
</body>
</html>
