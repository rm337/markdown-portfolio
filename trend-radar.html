<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Emerging Trend Radar | Fluid Soul</title>
<meta name="description" content="Emerging Trend Radar tracks weak signals across creativity, technology, culture and behavior before they become mainstream.">
<style>
*{box-sizing:border-box}html,body{margin:0;background:#06101a;color:#f7f2e9;font-family:Arial,sans-serif}body{min-height:100vh;background:radial-gradient(circle at 80% 0,rgba(1,116,243,.20),transparent 30%),#06101a}
main{width:min(1120px,calc(100% - 32px));margin:auto;padding:44px 0 80px}.back{color:#9dc9ff;text-decoration:none;font-weight:800}.eyebrow{margin:38px 0 10px;color:#0174F3;font-weight:900;letter-spacing:.16em;text-transform:uppercase;font-size:.78rem}h1{font-size:clamp(2.6rem,8vw,6rem);line-height:.95;margin:0;letter-spacing:-.05em}.intro{max-width:760px;color:#c5ced6;font-size:1.1rem;line-height:1.65}.meta{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0 34px}.pill{border:1px solid #29445d;border-radius:999px;padding:8px 12px;color:#b8c8d6;font-size:.82rem}.grid{display:grid;gap:18px}.card{background:#0a1723;border:1px solid #1c3449;border-radius:18px;padding:clamp(20px,4vw,32px);box-shadow:0 16px 42px rgba(0,0,0,.18)}.card:first-child{border-color:#0174F3;box-shadow:0 0 0 1px rgba(1,116,243,.18),0 18px 50px rgba(0,0,0,.25)}.top{display:flex;justify-content:space-between;gap:16px;align-items:center}.date{color:#9fb0bf;font-size:.82rem}.status{color:#7fbaff;border:1px solid rgba(1,116,243,.45);border-radius:999px;padding:6px 10px;font-size:.72rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase}h2{font-size:clamp(1.35rem,3vw,2rem);margin:18px 0 20px;line-height:1.15}.section{margin-top:17px}.label{display:block;color:#0174F3;font-size:.72rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px}.section p{margin:0;color:#d5dde4;line-height:1.62}.opportunity{background:#071f36;border-left:3px solid #0174F3;padding:16px;margin-top:20px;border-radius:0 10px 10px 0}.error{padding:24px;border:1px solid #633;border-radius:12px}footer{text-align:center;color:#0174F3;margin-top:48px;font-size:.86rem}
@media(max-width:600px){main{width:min(100% - 22px,1120px);padding-top:26px}.top{align-items:flex-start;flex-direction:column-reverse;gap:8px}}
</style>
</head>
<body><main>
<a class="back" href="index.html">← Fluid Soul</a>
<p class="eyebrow">Fluid Soul Intelligence</p><h1>Emerging<br>Trend Radar</h1>
<p class="intro">Weak signals, unusual cross-category patterns and rising creative approaches worth watching before they become ordinary.</p>
<div class="meta"><span class="pill" id="updated">Loading radar…</span><span class="pill" id="count"></span><span class="pill">No filler. Emerging signals only.</span></div>
<section class="grid" id="radar" aria-live="polite"></section>
<footer>A Little Ink. A Lot of Soul. The Color Blue.</footer>
</main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
fetch('data/emerging-trend-radar.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Radar data unavailable');return r.json()}).then(data=>{
 const entries=[...(data.entries||[])].sort((a,b)=>String(b.date).localeCompare(String(a.date)));
 document.getElementById('updated').textContent='Updated '+data.updated;
 document.getElementById('count').textContent=entries.length+' signals preserved';
 document.getElementById('radar').innerHTML=entries.map((e,i)=>`<article class="card">
 <div class="top"><span class="date">${esc(e.date)}${i===0?' · LATEST':''}</span><span class="status">${esc(e.status||'emerging')}</span></div>
 <h2>${esc(e.signal)}</h2>
 <div class="section"><span class="label">What is changing</span><p>${esc(e.what_is_changing)}</p></div>
 <div class="section"><span class="label">Why it matters</span><p>${esc(e.why_it_matters)}</p></div>
 <div class="opportunity"><span class="label">Creative opportunity</span><p>${esc(e.creative_opportunity)}</p></div>
 </article>`).join('');
}).catch(err=>{document.getElementById('updated').textContent='Radar unavailable';document.getElementById('radar').innerHTML='<div class="error">The Radar data could not be loaded. Please refresh in a moment.</div>'});
</script></body></html>
