<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fluid Systems • Smart Resume + FSTT Tester</title><style>:root{--b:#0174F3;--i:#132238;--m:#64748b;--l:#dbe4ee;--g:#087a55;--bg:#f5f8fc}*{box-sizing:border-box}body{margin:0;font:15px/1.45 Arial,sans-serif;color:var(--i);background:var(--bg)}header{height:72px;background:#fff;border-bottom:1px solid var(--l);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:5}.brand b{font-size:19px;letter-spacing:.08em}.brand small{display:block;color:var(--b);font-weight:800}.shell{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 72px)}nav{background:#fff;border-right:1px solid var(--l);padding:18px 12px}nav button{width:100%;text-align:left;border:0;background:transparent;padding:11px;border-radius:9px;font-weight:800;color:#334155;cursor:pointer;margin:2px 0}nav button:hover,nav button.on{background:#eef6ff;color:var(--b)}main{padding:22px;max-width:1450px;width:100%}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.s12{grid-column:span 12}.s8{grid-column:span 8}.s6{grid-column:span 6}.s4{grid-column:span 4}.card{background:#fff;border:1px solid var(--l);border-radius:14px;padding:17px;box-shadow:0 2px 8px #1231}h1{font-size:28px;margin:0 0 5px}h2{font-size:18px;margin:0 0 12px}.small{font-size:13px;color:var(--m)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.btn{border:1px solid var(--b);background:var(--b);color:#fff;border-radius:9px;padding:10px 13px;font-weight:800;cursor:pointer}.btn.alt{background:#fff;color:var(--b)}.btn.ghost{background:#fff;color:#475569;border-color:var(--l)}input,textarea,select{width:100%;border:1px solid #cbd5e1;border-radius:9px;padding:10px;font:inherit}textarea{min-height:170px;resize:vertical}label{display:block;font-size:11px;font-weight:900;color:#64748b;margin:8px 0 5px;letter-spacing:.05em}.pill{display:inline-block;border:1px solid var(--l);border-radius:999px;padding:5px 8px;font-size:11px;font-weight:900}.good{color:var(--g);background:#effbf7;border-color:#9bd7c1}.warn{color:#9a5b00;background:#fff8e8}.active{border:2px solid var(--b);background:#f7fbff}.drop{border:2px dashed #9eb3c7;border-radius:12px;padding:22px;text-align:center;background:#fbfdff}.metric{font-size:28px;font-weight:900}.login{min-height:calc(100vh - 72px);display:grid;place-items:center;padding:24px}.loginbox{width:min(520px,100%);background:#fff;border:1px solid var(--l);border-radius:16px;padding:24px;box-shadow:0 18px 50px #1232}.pf{border:2px solid #8acbb0;background:#f0fbf6;border-radius:13px;padding:15px}.pf.fail{border-color:#e3a2a2;background:#fff4f4}.pf b{font-size:28px;color:var(--g)}.pf.fail b{color:#a12a2a}.road{position:relative;min-height:175px;border:1px solid var(--l);border-radius:14px;overflow:hidden;background:linear-gradient(#eef7ff 0 55%,#dbe7ef 55% 66%,#26384b 66% 100%);padding:18px 15px 48px}.stops{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;position:relative;z-index:2}.stop{text-align:center;font-size:10px;font-weight:900;color:#526277}.stop i{display:grid;place-items:center;margin:auto auto 5px;width:26px;height:26px;border:2px solid #aab9c9;border-radius:50%;background:#fff;font-style:normal}.stop.done i{border-color:#55b992;color:var(--g);background:#effbf7}.stop.now i{border-color:var(--b);color:var(--b);box-shadow:0 0 0 4px #0174f31a}.stop.future{opacity:.5}.lane{position:absolute;left:5%;right:5%;bottom:33px;height:4px;background:repeating-linear-gradient(90deg,#fff 0 24px,transparent 24px 44px)}.truck{position:absolute;bottom:18px;width:70px;height:38px;transition:left .45s;z-index:4}.wagon{position:absolute;left:0;bottom:3px;width:47px;height:28px;background:#fff;border:3px solid var(--b);border-radius:5px}.wagon:after{content:'FSTT';position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:900;color:var(--b)}.cab{position:absolute;right:0;bottom:0;width:26px;height:25px;background:var(--b);border-radius:5px}.wheel{position:absolute;bottom:-4px;width:12px;height:12px;border-radius:50%;background:#152536;border:3px solid #91a5b9}.w1{left:9px}.w2{right:5px}.talk{position:absolute;bottom:70px;background:#fff;border:1px solid var(--l);border-radius:9px;padding:6px 8px;font-size:10px;font-weight:900;white-space:nowrap;box-shadow:0 3px 9px #1232;z-index:5}.log{border-left:2px solid var(--l);margin-left:7px;padding-left:16px}.li{padding:0 0 12px;position:relative}.li:before{content:'';position:absolute;left:-22px;top:4px;width:10px;height:10px;border-radius:50%;background:#aab7c7}.li.done:before{background:var(--g)}.li.now:before{background:var(--b)}@media(max-width:900px){.shell{grid-template-columns:1fr}nav{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--l);padding:8px}nav button{min-width:max-content}.s8,.s6,.s4{grid-column:span 12}main{padding:13px}.stops{grid-template-columns:repeat(4,1fr)}}</style></head><body><header><div class="brand"><b>FLUID SYSTEMS</b><small>Smart Resume Command Center™ + FSTT™</small></div><div class="small">A Little Ink. A Lot of Soul. The Color Blue.</div></header><div id="root"></div><input id="file" hidden type="file" accept=".pdf,.docx,.txt,.md,.rtf,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain"><script type="module">const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));const TEST='FSTT2026',ST=['Resume Depot','Job Board','Company Careers Site','ATS','Screening','Human Review','Hiring Manager','Disposition'];let mode=sessionStorage.getItem('fsTesterMode');const key=()=>mode==='tester'?'fs_public_tester_v1':'fs_public_owner_v1';const fresh=()=>({route:'home',resume:{name:'',text:'',loaded:''},jobs:[],apps:[],sel:null,backups:[]});let state=fresh();function load(){try{state={...fresh(),...JSON.parse(localStorage.getItem(key())||'{}')}}catch{state=fresh()}}function save(){localStorage.setItem(key(),JSON.stringify(state))}function login(){root.innerHTML=`<div class="login"><div class="loginbox"><h1>Tester Access</h1><p class="small">This tester edition includes both the Smart Resume Command Center and the Fluid Soul Tracker Truckster™.</p><div class="row" style="margin:14px 0"><button class="btn alt pick" data-m="owner">OWNER</button><button class="btn pick" data-m="tester">TESTER</button></div><label id="cl">TESTER ACCESS CODE</label><input id="code" type="password" placeholder="Enter access code"><button class="btn" id="go" style="margin-top:12px">SIGN IN</button><p class="small">Tester workspace is separate from the owner workspace.</p></div></div>`;let m='tester';document.querySelectorAll('.pick').forEach(b=>b.onclick=()=>{m=b.dataset.m;$('#cl').textContent=m==='tester'?'TESTER ACCESS CODE':'OWNER PIN';document.querySelectorAll('.pick').forEach(x=>x.className='btn '+(x.dataset.m===m?'':'alt'))});$('#go').onclick=()=>{let c=$('#code').value.trim();if(m==='tester'&&c!==TEST)return alert('Tester code is not correct.');if(m==='owner'){let p=localStorage.getItem('fs_owner_pin');if(!p){if(c.length<4)return alert('Create an Owner PIN with at least 4 characters.');localStorage.setItem('fs_owner_pin',c)}else if(c!==p)return alert('Owner PIN is not correct.')}mode=m;sessionStorage.setItem('fsTesterMode',m);load();app()}}function analyze(t){let lines=t.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),words=t.trim()?t.trim().split(/\s+/).length:0,heads=['summary','profile','experience','skills','education','leadership','capabilities'].filter(h=>lines.some(x=>x.toLowerCase().includes(h))),email=/[\w.+-]+@[\w.-]+\.[A-Za-z]{2,}/.test(t),flat=lines.some(x=>x.length>700);return{lines:lines.length,words,heads,email,flat,pass:lines.length>=20&&heads.length>=2&&email&&!flat}}function home(){let a=state.resume.text?analyze(state.resume.text):null;return `<h1>Command Center</h1><p class="small">Two connected products. One tester workspace.</p><div class="grid"><div class="card s6"><span class="pill">PRODUCT 1</span><h2 style="margin-top:10px">Smart Resume Command Center</h2><p>Upload or paste a résumé, run ATS Parse, and compare it with a job posting.</p><button class="btn go" data-r="resume">OPEN SMART RESUME</button></div><div class="card s6 active"><span class="pill good">PRODUCT 2</span><h2 style="margin-top:10px">🚛 FSTT • Fluid Soul Tracker Truckster™</h2><p>Track the actual application journey from résumé depot through ATS, human review and disposition.</p><button class="btn go" data-r="tracker">OPEN TRACKER TRUCKSTER</button></div><div class="card s12"><div class="row between"><div><b>Active résumé</b><div class="small">${esc(state.resume.name||'None loaded')}</div></div>${a?`<span class="pill ${a.pass?'good':'warn'}">ATS ${a.pass?'PASS':'FAIL'}</span>`:''}</div></div></div>`}function resume(){return `<h1>Resume Workspace</h1><p class="small">The active filename stays visible so you always know which résumé is loaded.</p><div class="grid"><div class="card s12 ${state.resume.text?'active':''}"><div class="row between"><div><b>ACTIVE RESUME</b><div class="small">${esc(state.resume.name||'No résumé loaded')}</div></div><div class="row"><button class="btn" id="up">UPLOAD / REPLACE</button><button class="btn ghost" id="clear">CLEAR</button></div></div></div><div class="card s12"><div class="drop"><b>ADD OR UPLOAD RESUME</b><div class="small">PDF, DOCX, TXT, MD or RTF</div><button class="btn" id="up2" style="margin-top:10px">CHOOSE FILE</button></div></div><div class="card s12"><label>RESUME TEXT</label><textarea id="ed" placeholder="Paste résumé text here or upload a file.">${esc(state.resume.text)}</textarea><button class="btn" id="saveEd" style="margin-top:10px">SAVE ACTIVE RESUME</button></div></div>`}function ats(){let a=state.resume.text?analyze(state.resume.text):null;return `<h1>ATS Parse + Resume Intelligence</h1><p class="small">PASS/FAIL is technical readability only, not a judgment of your career.</p>${!a?`<div class="card">Load a résumé first.</div>`:`<div class="pf ${a.pass?'':'fail'}"><div class="small">ATS READABILITY</div><b>${a.pass?'PASS':'FAIL'}</b><p>${a.pass?'The résumé has readable structure, contact information, and recognizable sections.':'The résumé has a technical parsing issue worth fixing before submission.'}</p></div><div class="grid" style="margin-top:14px"><div class="card s4"><div class="small">Readable lines</div><div class="metric">${a.lines}</div></div><div class="card s4"><div class="small">Words</div><div class="metric">${a.words}</div></div><div class="card s4"><div class="small">Recognized sections</div><div class="metric">${a.heads.length}</div></div><div class="card s12"><h2>Professional Assessment</h2><p>${a.heads.length>=3?'The résumé presents a recognizable professional structure with enough organization for both human and machine review.':'The résumé would benefit from clearer standard section headings so the structure is easier to interpret.'}</p><p>${a.email?'Contact information is detectable.':'An email address was not detected in the parsed text.'}</p><p>${a.flat?'The text appears unusually flattened into one or more very long lines, which can interfere with parsing.':'No suspiciously flattened long lines were detected.'}</p></div></div>`}`}function jobs(){return `<h1>Jobs</h1><p class="small">Paste the posting first. URL, company and title are optional.</p><div class="grid"><div class="card s8"><label>JOB POSTING / DESCRIPTION</label><textarea id="jt" placeholder="Paste the full job posting here"></textarea><label>URL OPTIONAL</label><input id="ju"><div class="row"><div style="flex:1"><label>COMPANY OPTIONAL</label><input id="jc"></div><div style="flex:1"><label>JOB TITLE OPTIONAL</label><input id="jr"></div></div><button class="btn" id="addj" style="margin-top:10px">SAVE JOB</button></div><div class="card s4"><h2>Saved Jobs</h2>${state.jobs.length?state.jobs.map(j=>`<div style="padding:9px 0;border-bottom:1px solid var(--l)"><b>${esc(j.title||'Untitled role')}</b><div class="small">${esc(j.company||'Company not entered')}</div></div>`).join(''):'<div class="small">No saved jobs yet.</div>'}</div></div>`}function stage(a){return Math.max(0,Math.min(7,Number(a.stage||0)))}function msg(i){return['Loaded up. Ready to roll.','Application submitted.','Company careers site detected.','ATS checkpoint detected.','Chugging along… Next stop: Human Review?','A human may have the wheel now.','Hiring Manager is the next destination.','Journey disposition recorded.'][i]}function tracker(){let apps=state.apps,sel=apps.find(a=>String(a.id)===String(state.sel))||apps[0],cur=sel?stage(sel):0,left=5+(cur/7)*82;return `<h1>FSTT</h1><p class="small"><b>FLUID SOUL TRACKER TRUCKSTER™</b> • TRACK IT. SEE IT. KNOW IT. OWN IT.</p><div class="grid"><div class="card s12"><div class="row between"><div><h2>${esc(sel?.title||'No journey selected')}</h2><div class="small">${esc(sel?.company||'Add an application below to put Truckster on the road.')}</div></div>${sel?`<span class="pill good">IN TRANSIT • FSTT-${String(sel.id).slice(-4)}</span>`:''}</div><div class="road"><div class="stops">${ST.map((s,i)=>`<div class="stop ${i<cur?'done':i===cur?'now':'future'}"><i>${i<cur?'✓':i+1}</i>${esc(s)}</div>`).join('')}</div>${sel?`<div class="talk" style="left:${left}%">${esc(msg(cur))}</div><div class="truck" style="left:${left}%"><div class="wagon"></div><div class="cab"></div><i class="wheel w1"></i><i class="wheel w2"></i></div>`:''}<div class="lane"></div></div></div><div class="card s4"><h2>Add Journey</h2><label>COMPANY</label><input id="ac"><label>ROLE / TITLE</label><input id="ar"><label>POSTING URL</label><input id="au"><label>HUMAN CONTACT</label><input id="ah"><label>NEXT ACTION</label><input id="an"><button class="btn" id="adda" style="margin-top:10px">PUT TRUCKSTER ON THE ROAD</button></div><div class="card s8"><h2>Tracked Journeys</h2>${apps.length?apps.map(a=>`<div style="padding:10px 0;border-bottom:1px solid var(--l)"><div class="row between"><div><b>${esc(a.title||'Untitled')} • ${esc(a.company||'Unknown')}</b><div class="small">${esc(ST[stage(a)])} • Résumé aboard: ${esc(a.resume||'None')}</div></div><button class="btn alt view" data-id="${a.id}">VIEW</button></div><label>MOVE TRUCKSTER</label><select class="move" data-id="${a.id}">${ST.map((s,i)=>`<option value="${i}" ${i===stage(a)?'selected':''}>${esc(s)}</option>`).join('')}</select></div>`).join(''):'<div class="small">No journeys yet.</div>'}</div>${sel?`<div class="card s6"><h2>Live Journey Log</h2><div class="log">${ST.map((s,i)=>`<div class="li ${i<cur?'done':i===cur?'now':''}"><b>${esc(s)}</b><div class="small">${i<cur?'CONFIRMED':i===cur?'DETECTED':i===cur+1?'INFERRED':'UNKNOWN'}</div></div>`).join('')}</div></div><div class="card s6"><h2>Current Status</h2><div class="metric">${esc(ST[cur])}</div><p>${esc(msg(cur))}</p><p class="small">FSTT distinguishes confirmed, detected, inferred and unknown signals. It does not pretend to see inside an employer system without evidence.</p></div>`:''}</div>`}function backups(){return `<h1>Backup Copies</h1><div class="card">${state.backups.length?state.backups.map((b,i)=>`<div style="padding:9px 0;border-bottom:1px solid var(--l)"><b>${esc(b.name)}</b><div class="small">${esc(b.when)}</div><button class="btn alt restore" data-i="${i}">RESTORE</button></div>`).join(''):'<div class="small">No backup copies yet.</div>'}</div>`}function access(){return `<h1>Access</h1><div class="card"><p>Signed in as <b>${mode.toUpperCase()}</b>.</p><p class="small">Tester workspace is isolated from the owner workspace on this browser.</p><button class="btn ghost" id="logout">SIGN OUT</button></div>`}function app(){root.innerHTML=`<div class="shell"><nav><button data-r="home">Command Center</button><button data-r="jobs">Jobs</button><button data-r="tracker" style="border:2px solid var(--b);color:var(--b)">🚛 FSTT • TRACKER TRUCKSTER</button><button data-r="resume">Resume Workspace</button><button data-r="ats">ATS Parse</button><button data-r="backups">Backup Copies</button><button data-r="access">Access</button></nav><main id="main"></main></div>`;render()}function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.r===state.route));main.innerHTML=state.route==='resume'?resume():state.route==='ats'?ats():state.route==='jobs'?jobs():state.route==='tracker'?tracker():state.route==='backups'?backups():state.route==='access'?access():home();bind()}function backup(){if(state.resume.text)state.backups.unshift({...state.resume,when:new Date().toLocaleString()})}async function fileLoad(f){try{let t='';if(f.name.toLowerCase().endsWith('.pdf')){let pdfjs=await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs');pdfjs.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';let p=await pdfjs.getDocument({data:await f.arrayBuffer()}).promise,rows=[];for(let n=1;n<=p.numPages;n++){let pg=await p.getPage(n),c=await pg.getTextContent(),items=c.items.filter(x=>x.str?.trim()).map(x=>({s:x.str.trim(),x:x.transform[4],y:x.transform[5]})).sort((a,b)=>b.y-a.y||a.x-b.x),groups=[];for(let it of items){let g=groups.find(r=>Math.abs(r.y-it.y)<=3.5);if(g)g.a.push(it);else groups.push({y:it.y,a:[it]})}groups.sort((a,b)=>b.y-a.y);rows.push(...groups.map(g=>g.a.sort((a,b)=>a.x-b.x).map(x=>x.s).join(' ')))}t=rows.join('\n')}else if(f.name.toLowerCase().endsWith('.docx')){let m=await import('https://cdn.jsdelivr.net/npm/mammoth@1.8.0/+esm');t=(await m.extractRawText({arrayBuffer:await f.arrayBuffer()})).value}else t=await f.text();backup();state.resume={name:f.name,text:t,loaded:new Date().toLocaleString()};save();state.route='resume';render()}catch(e){alert('Could not read this file: '+e.message)}}function bind(){document.querySelectorAll('[data-r],.go').forEach(b=>b.onclick=()=>{state.route=b.dataset.r;save();render()});let up=$('#up'),up2=$('#up2');if(up)up.onclick=()=>file.click();if(up2)up2.onclick=()=>file.click();let cl=$('#clear');if(cl)cl.onclick=()=>{if(confirm('Clear active résumé? A backup copy will be made first.')){backup();state.resume=fresh().resume;save();render()}};let se=$('#saveEd');if(se)se.onclick=()=>{backup();state.resume={name:state.resume.name||'Pasted Resume',text:$('#ed').value.trim(),loaded:new Date().toLocaleString()};save();render()};let aj=$('#addj');if(aj)aj.onclick=()=>{let t=$('#jt').value.trim();if(!t)return alert('Paste a job posting first.');state.jobs.unshift({id:Date.now(),text:t,url:$('#ju').value.trim(),company:$('#jc').value.trim(),title:$('#jr').value.trim()});save();render()};let aa=$('#adda');if(aa)aa.onclick=()=>{let a={id:Date.now(),company:$('#ac').value.trim(),title:$('#ar').value.trim(),url:$('#au').value.trim(),human:$('#ah').value.trim(),next:$('#an').value.trim(),stage:1,resume:state.resume.name};if(!a.company&&!a.title)return alert('Enter a company or role.');state.apps.unshift(a);state.sel=a.id;save();render()};document.querySelectorAll('.view').forEach(b=>b.onclick=()=>{state.sel=Number(b.dataset.id);save();render()});document.querySelectorAll('.move').forEach(s=>s.onchange=()=>{let a=state.apps.find(x=>String(x.id)===s.dataset.id);if(a){a.stage=Number(s.value);state.sel=a.id;save();render()}});document.querySelectorAll('.restore').forEach(b=>b.onclick=()=>{let x=state.backups[Number(b.dataset.i)];if(x){backup();state.resume={name:x.name,text:x.text,loaded:new Date().toLocaleString()};save();state.route='resume';render()}});let lo=$('#logout');if(lo)lo.onclick=()=>{sessionStorage.removeItem('fsTesterMode');location.reload()}}file.onchange=e=>{let f=e.target.files[0];if(f)fileLoad(f);e.target.value=''}}if(!mode)login();else{load();app()}</script></body></html>
