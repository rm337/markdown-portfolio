<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fluid Systems Tester Access</title><style>body{margin:0;display:grid;place-items:center;min-height:100vh;font-family:Arial,sans-serif;background:#f6f9fc;color:#132238}.box{width:min(520px,calc(100% - 32px));background:white;border:1px solid #dbe4ee;border-radius:16px;padding:26px;box-shadow:0 18px 50px #1232}.brand{color:#0174F3;font-weight:900;letter-spacing:.08em}.small{color:#64748b;font-size:13px}.label{display:block;font-size:12px;font-weight:800;color:#64748b;margin:18px 0 6px}.code{width:100%;box-sizing:border-box;border:1px solid #cbd5e1;border-radius:10px;padding:12px;font:inherit}.btn{margin-top:12px;width:100%;border:1px solid #0174F3;background:#0174F3;color:#fff;border-radius:10px;padding:12px;font-weight:900;cursor:pointer}.err{color:#a12a2a;font-weight:700;min-height:20px;margin-top:10px}</style></head><body><div class="box"><div class="brand">FLUID SYSTEMS</div><h1>Tester Access</h1><p class="small">Smart Resume Command Center™ + FSTT Tracker Truckster™</p><label class="label">TESTER ACCESS CODE</label><input class="code" id="testerCode" type="password" autocomplete="off" placeholder="Enter tester code"><button class="btn" id="enterTester">ENTER TESTER WORKSPACE</button><div class="err" id="err"></div></div><script>const TESTER_CODE='FSTT2026';const PARTS='../resume-tester/app-parts/';async function launch(){document.body.innerHTML='<div class="box"><div class="brand">FLUID SYSTEMS</div><h2>Loading Tester Workspace…</h2></div>';sessionStorage.setItem('fs_srcc_v45_session','tester');const files=['01','02','03','04','05','06','07','08'].map(n=>PARTS+n+'.txt?v=56');try{const parts=await Promise.all(files.map(f=>fetch(f,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(f+' '+r.status);return r.text()})));let html=parts.join('');html=html.replace('<h4>SYSTEM</h4><button data-route="access">Access</button>','');html=html.replace(/function authScreen\(\)[\s\S]*?function currentMode\(\)/,'function authScreen(){}\nfunction currentMode()');html=html.replace("function currentMode(){return sessionStorage.getItem('fs_srcc_v45_session')||'owner'}","function currentMode(){return 'tester'}");html=html.replace("function storageKey(){return currentMode()==='tester'?'fs_srcc_v45_tester':'fs_srcc_v4'}","function storageKey(){return 'fs_srcc_v45_tester'}");html=html.replace("const who=sessionStorage.getItem('fs_srcc_v45_session')==='tester'?'TESTER':'OWNER';","const who='TESTER';");html=html.replace("if(!authState().loggedIn){authScreen()}else{render()}","sessionStorage.setItem('fs_srcc_v45_session','tester');render()");html=html.replace(/\$\{ownerAccessPanel\(\)\}/g,'');document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="box"><div class="brand">LOAD ERROR</div><p>'+e.message+'</p></div>'}}document.getElementById('enterTester').onclick=()=>{const v=document.getElementById('testerCode').value.trim();if(v!==TESTER_CODE){document.getElementById('err').textContent='Tester code not recognized.';return}launch()};document.getElementById('testerCode').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('enterTester').click()});</script></body></html>
