<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fluid Systems Tester Access</title><style>html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#f6f9fc;color:#132238}.gate{min-height:100vh;display:grid;place-items:center}.box{width:min(520px,calc(100% - 32px));background:white;border:1px solid #dbe4ee;border-radius:16px;padding:26px;box-shadow:0 18px 50px #1232}.brand{color:#0174F3;font-weight:900;letter-spacing:.08em}.small{color:#64748b;font-size:13px}.label{display:block;font-size:12px;font-weight:800;color:#64748b;margin:18px 0 6px}.code{width:100%;box-sizing:border-box;border:1px solid #cbd5e1;border-radius:10px;padding:12px;font:inherit}.btn{margin-top:12px;width:100%;border:1px solid #0174F3;background:#0174F3;color:#fff;border-radius:10px;padding:12px;font-weight:900;cursor:pointer}.err{color:#a12a2a;font-weight:700;min-height:20px;margin-top:10px}</style></head><body><div class="gate" id="gate"><div class="box"><div class="brand">FLUID SYSTEMS</div><h1>Tester Access</h1><p class="small">Smart Resume Command Center™ + FSTT Tracker Truckster™</p><label class="label">TESTER ACCESS CODE</label><input class="code" id="testerCode" type="password" autocomplete="off" placeholder="Enter tester code"><button class="btn" id="enterTester">ENTER TESTER WORKSPACE</button><div class="err" id="err"></div></div></div><script>const TESTER_CODE='FSTT2026';const PARTS='../resume-tester/app-parts/';async function launch(){const gate=document.getElementById('gate');gate.innerHTML='<div class="box"><div class="brand">FLUID SYSTEMS</div><h2>Loading Tester Workspace…</h2></div>';try{const files=['01','02','03','04','05','06','07','08'].map(n=>PARTS+n+'.txt?v=63');const [parts,extra]=await Promise.all([Promise.all(files.map(async f=>{const r=await fetch(f,{cache:'no-store'});if(!r.ok)throw new Error('Could not load application file: '+f+' ('+r.status+')');return r.text()})),fetch(PARTS+'06b-resume-ui.txt?v=63',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Could not load resume UI ('+r.status+')');return r.text()})]);let app=parts.join('');const marker='function render()';if(!app.includes(marker))throw new Error('Application render boundary missing');app=app.replace(marker,extra+'\n'+marker);app=app.replace('<h4>SYSTEM</h4><button data-route="access">Access</button>','');app=app.replace("function currentMode(){return sessionStorage.getItem('fs_srcc_v45_session')||'owner'}","function currentMode(){return 'tester'}");app=app.replace("function storageKey(){return currentMode()==='tester'?'fs_srcc_v45_tester':'fs_srcc_v4'}","function storageKey(){return 'fs_srcc_v45_tester'}");localStorage.setItem('fs_srcc_v45_auth',JSON.stringify({ownerPinHash:'disabled',testerCodeHash:'506d9eb4f30efeee0a186c3216ea8348439832f51a53a5d88c1800f658b00013'}));sessionStorage.setItem('fs_srcc_v45_session','tester');document.open();document.write(app);document.close()}catch(e){document.body.innerHTML='<div class="gate"><div class="box"><div class="brand">LOAD ERROR</div><p>'+String(e.message||e)+'</p></div></div>'}}document.getElementById('enterTester').onclick=()=>{const v=document.getElementById('testerCode').value.trim();if(v!==TESTER_CODE){document.getElementById('err').textContent='Tester code not recognized.';return}launch()};document.getElementById('testerCode').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('enterTester').click()});</script></body></html>
