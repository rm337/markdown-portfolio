name: Resume Tester Hosted Readiness E2E

on:
  push:
    branches: [main]
    paths:
      - 'resume-tester/**'
      - 'resume-tester-clean/**'
      - '.github/workflows/resume-tester-hosted-readiness-e2e.yml'
  workflow_dispatch:

jobs:
  hosted-readiness-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser-test hosted persistence backups and job intake
        run: |
          cat > readiness-e2e.js <<'EOF'
          const {chromium}=require('playwright');
          const fs=require('fs');
          (async()=>{
            fs.writeFileSync('/tmp/qa-resume.txt',[
              'ROBERT TESTER','robert@example.com','PROFESSIONAL SUMMARY',
              'Creative director and brand leader.','EXPERIENCE','Creative Director',
              'Led brand strategy and creative systems.','EDUCATION','Oakland Community College'
            ].join('\n'));
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            const errors=[];
            page.on('console',m=>{if(m.type()==='error')errors.push('console: '+m.text())});
            page.on('pageerror',e=>errors.push('pageerror: '+e.message));
            async function enterTester(forceFreshSession=false){
              if(forceFreshSession){
                try{await page.evaluate(()=>sessionStorage.clear())}catch{}
              }
              await page.goto('https://oceanofink.com/resume-tester-clean/?hosted-readiness-e2e='+Date.now(),{waitUntil:'networkidle',timeout:30000});
              const gate=page.locator('#testerCode');
              if(await gate.isVisible().catch(()=>false)){
                const code=await page.evaluate(()=>{const src=[...document.scripts].map(s=>s.textContent||'').join('\n');const m=src.match(/TESTER_CODE='([^']+)'/);return m?m[1]:''});
                if(!code) throw new Error('Tester code could not be read from hosted gate');
                await gate.fill(code);
                await page.locator('#enterTester').click();
              }
              await page.locator('button[data-route="resume"]').waitFor({state:'visible',timeout:20000});
            }
            async function openResume(){
              await page.locator('button[data-route="resume"]').click();
              await page.getByRole('heading',{name:'Resume Workspace',exact:true}).waitFor({state:'visible',timeout:10000});
            }
            await enterTester(true);
            await openResume();
            if(await page.getByText('UPLOAD RESUME',{exact:true}).first().isVisible().catch(()=>false)){
              const chooserPromise=page.waitForEvent('filechooser');
              await page.getByText('UPLOAD RESUME',{exact:true}).first().click();
              const chooser=await chooserPromise;
              await chooser.setFiles('/tmp/qa-resume.txt');
              await page.getByText('qa-resume.txt',{exact:true}).first().waitFor({state:'visible',timeout:10000});
            } else if(!await page.getByText('qa-resume.txt',{exact:true}).first().isVisible().catch(()=>false)){
              const chooserPromise=page.waitForEvent('filechooser');
              await page.getByText('REPLACE RESUME',{exact:true}).click();
              const chooser=await chooserPromise;
              await chooser.setFiles('/tmp/qa-resume.txt');
              await page.getByText('qa-resume.txt',{exact:true}).first().waitFor({state:'visible',timeout:10000});
            }

            await enterTester(true);
            await openResume();
            await page.getByText('qa-resume.txt',{exact:true}).first().waitFor({state:'visible',timeout:10000});
            const editor=page.locator('#editor');
            const original=await editor.inputValue();
            await editor.fill(original+'\nPERSISTENCE MARKER');
            await page.getByText('SAVE EDITS',{exact:true}).click();
            await page.locator('button[data-route="backups"]').click();
            await page.getByText('Automatic backup before edit',{exact:false}).first().waitFor({state:'visible',timeout:10000});
            await page.screenshot({path:'/tmp/hosted-readiness-backup.png',fullPage:true});
            await page.getByText('RESTORE',{exact:true}).first().click();
            await openResume();
            const restored=await page.locator('#editor').inputValue();
            if(restored.includes('PERSISTENCE MARKER')) throw new Error('Backup restore did not restore the pre-edit resume');

            await page.locator('button[data-route="jobs"]').click();
            const posting=['Creative Director','Company: Fluid Systems QA','Remote','$150,000 - $180,000 per year','Lead brand strategy, campaigns, and creative systems.'].join('\n');
            await page.locator('#jobText').fill(posting);
            await page.getByText('ANALYZE JOB POSTING',{exact:true}).click();
            let jobsText=await page.locator('#app').innerText();
            for(const expected of ['TITLE: Creative Director','COMPANY: Fluid Systems QA','LOCATION: Remote','$150,000 - $180,000 per year']){
              if(!jobsText.includes(expected)) throw new Error('Detected job missing: '+expected);
            }
            await page.screenshot({path:'/tmp/hosted-readiness-job.png',fullPage:true});

            await enterTester(true);
            await page.locator('button[data-route="jobs"]').click();
            jobsText=await page.locator('#app').innerText();
            if(!jobsText.includes('Fluid Systems QA')||!jobsText.includes('Creative Director')) throw new Error('Detected job did not persist across reload/login');
            if(errors.length) throw new Error(errors.join(' | '));
            console.log('HOSTED READINESS PASS: resume persistence -> edit backup -> restore -> job intake without URL/company/title -> job persistence');
            await browser.close();
          })().catch(e=>{console.error('HOSTED READINESS EXACT FAILURE: '+e.message);process.exit(1)});
          EOF
          node readiness-e2e.js
      - name: Upload readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resume-tester-hosted-readiness-evidence
          path: |
            /tmp/hosted-readiness-backup.png
            /tmp/hosted-readiness-job.png
          if-no-files-found: ignore
