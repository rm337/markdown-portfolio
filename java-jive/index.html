<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2B1B14">
<title>Java Jive™ | Coffee Flavor Pun Generator</title>
<style>
:root{--espresso:#2B1B14;--dark:#4A2C1D;--coffee:#6F4E37;--caramel:#B9783D;--latte:#CFAF8B;--cream:#F5E6CF;--foam:#FFF8EB;--blue:#0174F3}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:radial-gradient(circle at top,var(--foam),var(--cream));color:var(--espresso);min-height:100vh;display:grid;place-items:center;padding:22px}
.app{width:min(740px,100%);background:rgba(255,248,235,.88);border:1px solid rgba(111,78,55,.18);border-radius:30px;padding:30px;box-shadow:0 24px 70px rgba(43,27,20,.17)}
.brand{font-weight:950;letter-spacing:-2.5px;font-size:clamp(44px,10vw,76px);line-height:.9;color:var(--espresso)}
.tm{font-size:.25em;vertical-align:top;letter-spacing:0;color:var(--blue)}
.kicker{margin:13px 0 25px;color:var(--coffee);font-size:1.08rem;font-weight:650}
label{font-weight:900;display:block;margin-bottom:9px}.row{display:flex;gap:10px;flex-wrap:wrap}
input{flex:1;min-width:220px;padding:15px 16px;border-radius:14px;border:1px solid var(--latte);background:white;font-size:17px;outline:none;color:var(--espresso)}
input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(1,116,243,.13)}
button{border:0;border-radius:14px;padding:14px 17px;font-weight:900;font-size:15px;cursor:pointer;transition:.16s transform,.16s opacity;background:var(--blue);color:white}
button:hover{transform:translateY(-1px)}button:active{transform:translateY(0)}button.secondary{background:var(--coffee);color:white}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.chip{padding:9px 12px;background:white;color:var(--dark);border:1px solid var(--latte);border-radius:999px;font-weight:800;font-size:13px}.chip:hover{border-color:var(--blue);color:var(--blue)}
.result{margin-top:25px;background:linear-gradient(145deg,var(--espresso),var(--dark));color:var(--foam);border-radius:23px;padding:25px;display:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}.result.show{display:block;animation:pop .25s ease-out}@keyframes pop{from{opacity:0;transform:scale(.975)}to{opacity:1;transform:scale(1)}}
.eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--latte);font-weight:950}.name{font-size:clamp(31px,7vw,50px);font-weight:950;letter-spacing:-1.5px;margin:7px 0}.tag{font-size:18px;font-weight:850;color:#f1cf9d}.desc{line-height:1.55;color:#eadfd4;margin:12px 0 19px}
.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{background:white;color:var(--espresso)}.actions button.primary{background:var(--blue);color:white}
.footer{margin-top:23px;text-align:center}.system{font-size:11px;text-transform:uppercase;letter-spacing:1.8px;color:var(--coffee);font-weight:900}.tagline{margin-top:5px;color:var(--blue);font-weight:900;font-size:14px}
@media(max-width:540px){.app{padding:22px;border-radius:23px}.row button{flex:1}.actions button{flex:1}.brand{letter-spacing:-1.8px}}
</style>
</head>
<body>
<main class="app">
<div class="brand">JAVA JIVE<span class="tm">™</span></div>
<div class="kicker">Give me a flavor. I’ll give it some jive. ☕🎶</div>
<label for="flavor">What are we brewing?</label>
<div class="row"><input id="flavor" placeholder="Caramel, mocha, hazelnut…" autocomplete="off"><button id="jive">JIVE IT</button><button class="secondary" id="surprise">SURPRISE ME</button></div>
<div class="chips" id="chips"></div>
<section class="result" id="result"><div class="eyebrow" id="source"></div><div class="name" id="name"></div><div class="tag" id="tag"></div><div class="desc" id="desc"></div><div class="actions"><button class="primary" id="again">☕ JIVE ME ANOTHER</button><button id="copy">📋 COPY</button><button id="share">↗ SHARE</button></div></section>
<footer class="footer"><div class="system">A Fluid Systems Gadget</div><div class="tagline">A Little Ink. A Lot of Soul. The Color Blue.</div></footer>
</main>
<script>
const flavors={caramel:[["Caramel Me Maybe","Hey, I just brewed you.","Buttery caramel meets a confident roast that has absolutely no intention of being subtle."],["Caramel Knowledge","Consider yourself informed.","A smooth caramel cup delivering a highly caffeinated education."],["Caramel of the Wild","Take a walk on the sweet side.","Roasty, buttery and just unruly enough to ignore the recommended serving size."]],mocha:[["Mocha Me Crazy","Chocolate made me do it.","Coffee and cocoa have entered a deliciously questionable agreement."],["Mocha Motion","Proceed with caffeination.","Chocolate-powered momentum for mornings that refuse to start themselves."],["Mocha Lotta Love","Affection, now available by the mug.","A chocolatey roast with feelings. Possibly too many feelings."]],hazelnut:[["HazelNUTS About Brew","Completely roasted.","Toasty hazelnut with a devotion to coffee that may require supervision."],["A Hard Nut to Brew","Crack the cup.","Warm hazelnut flavor for people who consider one cup preliminary paperwork."],["Hazel Said What?","Nutty by nature.","Hazelnut walks into a coffee shop and somehow leaves with top billing."]],vanilla:[["Vanilla Be Back","This cup has unfinished business.","Smooth vanilla keeps returning to the scene of the grind."],["Vanilla Minute","Sweetness is brewing.","A mellow vanilla roast for anyone whose five-minute break has become a lifestyle."],["Vanilla Ice, Ice, Coffee","Too cold? Too bold.","Vanilla flavor with enough rhythm to keep the cold brew moving."]],cinnamon:[["Cinna-Minute","Spice needs a second.","Warm cinnamon wakes up the roast before the alarm gets a chance."],["Cinna-Man Bun","A twist on top.","Cinnamon, coffee and questionable hair decisions, all in one imaginary roast."],["Cinna-Sational","Spice has entered the chat.","A warm, aromatic cup that refuses to behave like ordinary coffee."]],chocolate:[["Choco-Latte About It","There is much to discuss.","Chocolate and coffee settle their differences over a very persuasive mug."],["Cocoa Loco","Reason has left the coffeehouse.","Rich chocolate takes the roast on a tiny vacation from responsibility."],["Choc Full O' Jive","Packed with wordplay.","A chocolate roast with more punchlines than nutritional information."]],pumpkin:[["Pumpkin to Talk About","Spill the spice.","Pumpkin and coffee finally address the rumors surrounding autumn."],["Gourd Morning","Rise and spice.","Pumpkin spice reports for duty before you do."],["Pump Up the Jam","And pass the coffee.","Pumpkin flavor turned the breakfast table into a very small concert."]],espresso:[["Espresso Yourself","Repression is exhausting.","A tiny cup with absolutely enormous opinions."],["Depresso No More","Emergency mood roast.","Espresso arrives with a concentrated argument against mornings."],["Press Your Luck","One more shot?","Bold espresso for people who hear 'enough caffeine' as a creative suggestion."]]};
const keys=Object.keys(flavors),input=document.getElementById("flavor"),result=document.getElementById("result"),chips=document.getElementById("chips");keys.forEach(k=>{let b=document.createElement("button");b.className="chip";b.textContent=k[0].toUpperCase()+k.slice(1);b.onclick=()=>{input.value=k;jive(k)};chips.appendChild(b)});let currentFlavor="mocha",currentIndex=-1;function pick(arr){let i=Math.floor(Math.random()*arr.length);if(arr.length>1&&i===currentIndex)i=(i+1)%arr.length;currentIndex=i;return arr[i]}function custom(f){const clean=f.trim()||"coffee",cap=clean.charAt(0).toUpperCase()+clean.slice(1);const templates=[[`${cap} Jive`,`Put a little swing in your sip.`,`A ${clean} coffee creation that came for the flavor and stayed for the wordplay.`],[`Brewed Awakening: ${cap}`,`Your cup has something to say.`,`A ${clean}-flavored roast with enough personality to need its own mug.`],[`Grounds for ${cap}`,`The evidence is delicious.`,`A ${clean} coffee experiment roasted somewhere between clever and caffeinated.`]];return pick(templates)}function jive(force){const f=(force||input.value).trim().toLowerCase();if(!f){input.focus();return}currentFlavor=f;const r=flavors[f]?pick(flavors[f]):custom(f);document.getElementById("source").textContent=f+" flavor";document.getElementById("name").textContent=r[0];document.getElementById("tag").textContent=r[1];document.getElementById("desc").textContent=r[2];result.classList.remove("show");void result.offsetWidth;result.classList.add("show")}document.getElementById("jive").onclick=()=>jive();document.getElementById("surprise").onclick=()=>{let f=keys[Math.floor(Math.random()*keys.length)];input.value=f;jive(f)};document.getElementById("again").onclick=()=>jive(currentFlavor);input.addEventListener("keydown",e=>{if(e.key==="Enter")jive()});function resultText(){return `${document.getElementById("name").textContent}\n${document.getElementById("tag").textContent}\n\n${document.getElementById("desc").textContent}\n\nJava Jive™\nA Little Ink. A Lot of Soul. The Color Blue.`}document.getElementById("copy").onclick=async e=>{await navigator.clipboard.writeText(resultText());let old=e.target.textContent;e.target.textContent="✓ COPIED";setTimeout(()=>e.target.textContent=old,1200)};document.getElementById("share").onclick=async()=>{let text=resultText();if(navigator.share){await navigator.share({title:"Java Jive™",text})}else{await navigator.clipboard.writeText(text);alert("Result copied. Paste it wherever you want to share it.")}}
</script>
</body>
</html>
